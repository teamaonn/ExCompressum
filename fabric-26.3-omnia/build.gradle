plugins { id 'net.fabricmc.fabric-loom' version '1.18.2' }
version='26.3.0.0-omnia.2'
group='net.blay09.mods'
base { archivesName='excompressum-fabric-26.3' }
repositories { maven { url='https://maven.fabricmc.net/' }; maven { url='https://maven.twelveiterations.com/repository/maven-public/' } }
dependencies {
 minecraft 'com.mojang:minecraft:26.3'
 implementation 'net.fabricmc:fabric-loader:0.19.5'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.160.7+26.3'
 implementation 'net.blay09.mods:balm-fabric:26.3.0.1'
 implementation files(providers.gradleProperty('omnia_jar').get())
}
sourceSets { main { java.srcDirs=['../common/src/main/java','../fabric/src/main/java']; resources.srcDirs=['../common/src/main/resources','../common/src/generated/resources','../fabric/src/main/resources'] } }
processResources {
 inputs.property('version',project.version)
 filesMatching('fabric.mod.json') { expand version:project.version,mod_name:'Ex Compressum',description:'Ex Nihilo Omnia integration',homepage:'https://github.com/teamaonn/ExCompressum',sources:'https://github.com/teamaonn/ExCompressum',issues:'https://github.com/teamaonn/ExCompressum/issues',license:'All Rights Reserved',fabric_loader_version:'0.19.5',balm_version:'26.3.0.1',fabric_minecraft_version_range:'26.3',java_version:'25' }
}
java { toolchain.languageVersion=JavaLanguageVersion.of(25); sourceCompatibility=JavaVersion.VERSION_25;targetCompatibility=JavaVersion.VERSION_25;withSourcesJar() }
fabricApi { configureTests { createSourceSet=true;modId='excompressum-test';enableGameTests=true;enableClientGameTests=true } }
sourceSets.gametest.java.srcDirs=['../fabric/src/gametest/java']
sourceSets.gametest.resources.srcDirs=['../fabric/src/gametest/resources']
jar { from('../LICENSE') }
dependencies {
 if(providers.gradleProperty('aa_jar').isPresent()) gametestRuntimeOnly files(providers.gradleProperty('aa_jar').get())
 if(providers.gradleProperty('jei_jar').isPresent()) gametestRuntimeOnly files(providers.gradleProperty('jei_jar').get())
}
